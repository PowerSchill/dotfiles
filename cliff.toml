# Release notes for `mise run release:preview` (git-cliff). Prints to stdout;
# nothing is tagged, written or published.
#
# A Release is a date tag such as v2026.10.31, created by hand. Notes cover the
# Conventional Commits since the previous Release. chore commits (including
# chezmoi's autoCommits) are left out; commits from before Conventional Commits
# were adopted appear under "Other".

[changelog]
header = ""
body = """
{% if version -%}
## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else -%}
## Unreleased
{% endif %}
{%- for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits -%}
- {% if commit.scope and commit.scope != "other" %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}
{%- endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
tag_pattern = "^v[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}$"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^revert", group = "<!-- 4 -->Reverted" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^test", group = "<!-- 6 -->Tests" },
  { message = "^ci", group = "<!-- 7 -->CI" },
  { message = "^chore", skip = true },
  { message = ".*", group = "<!-- 9 -->Other", default_scope = "other" },
]
