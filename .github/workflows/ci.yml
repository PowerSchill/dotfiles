# CI calls the same `mise run` tasks a developer runs (R17). The only other steps
# are checkout, caching, and environment plumbing, each marked "Plumbing" below.
# Linux validate runs in the dev container image (.devcontainer/), so zsh is
# installed only for the acceptance job. tests/acceptance/r17.bats enforces this.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1" # weekly, Monday: also runs the WSL job

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # chezmoi's gitHub* template functions use this to avoid API rate limits.
  CHEZMOI_GITHUB_ACCESS_TOKEN: ${{ github.token }}

jobs:
  # Linux validate runs in the published dev container image, which already has
  # zsh and the rest of the system prerequisites. Root, because the checkout is
  # mounted owned by the runner's user; the Toolchain installs under $HOME.
  validate-linux:
    name: validate (ubuntu-latest)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/powerschill/dotfiles-dev:latest@sha256:ba4f130147e27de220598e877dea5e8e8d1c17a19150ee88c32258e945ad78e7
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # check:repo scans every commit
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-devcontainer-${{ runner.arch }}-${{ hashFiles('mise.lock') }}
      - run: tools/bootstrap.sh
      # Plumbing: make the mise that bootstrap installed visible to later steps.
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mise run validate

  validate-macos:
    name: validate (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # check:repo scans every commit
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}
      - run: tools/bootstrap.sh
      # Plumbing: make the mise that bootstrap installed visible to later steps.
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mise run validate

  apply:
    name: check:apply (${{ matrix.os }}, ${{ matrix.roles }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        roles:
          - ephemeral
          - dev,gui,work,personal,security,onepassword,homelab
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}
      - run: tools/bootstrap.sh
      # Plumbing: make the mise that bootstrap installed visible to later steps.
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mise run check:apply --roles "${{ matrix.roles }}"

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}
      # Plumbing (the one remaining exception): zsh is a system prerequisite mise
      # cannot install (check:zsh). This job drives Docker itself, so it runs on
      # the host rather than in the dev container image.
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - run: tools/bootstrap.sh
      # Plumbing: make the mise that bootstrap installed visible to later steps.
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mise run test:acceptance

  wsl:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: git curl ca-certificates zsh
      - run: tools/bootstrap.sh
      - run: ~/.local/bin/mise run check
