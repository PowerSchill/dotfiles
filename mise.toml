# Toolchain for working on this repository (see GLOSSARY.md, docs/adr/0001, docs/adr/0002).
#
# This file is the `minimal` Profile: everything CI and the commit hook need.
# `mise.full.toml` adds optional extras and is loaded when the `full` Profile is
# selected (tools/bin/dotfiles-profile writes `.miserc.local.toml` to choose it).
#
# Versions are exact pins so the commit hook and CI cannot drift; Renovate bumps
# them. `latest` is allowed only in mise.full.toml.
#
# Fresh machine: tools/bootstrap.sh. Afterwards: `mise tasks` lists every chore.

min_version = "2026.10.25"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64"]

[env]
_.path = ["{{config_root}}/tools/bin"]
DOTFILES_ROOT = "{{config_root}}"
# pre-commit is a Python zipapp; keep it from littering the tree or reading user site-packages.
PYTHONDONTWRITEBYTECODE = "1"
PYTHONNOUSERSITE = "1"

[tools]
chezmoi = "2.73.3"
python = "3.14.10" # interpreter for pre-commit's .pyz
pre-commit = "4.7.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
gitleaks = "8.30.1"
cocogitto = "7.0.0"
bats = "1.14.0"
yq = "4.54.1"
jq = "1.8.2"

# --- Setup -----------------------------------------------------------------

[tasks.profile]
description = "Detect the Toolchain Profile and record it for mise"
run = "dotfiles-profile --write"

[tasks.install]
description = "Install the Toolchain for the current Profile"
depends = ["profile"]
sources = ["mise.toml", "mise.*.toml", "mise.lock", ".miserc.local.toml"]
outputs = { auto = true }
# A fresh process so the Profile written by `profile` is picked up.
run = [
  "env -u MISE_ENV mise install --yes",
  { task = "hooks:install" },
]

[tasks."hooks:install"]
description = "Install the git hooks (skipped in CI)"
sources = [".pre-commit-config.yaml"]
outputs = { auto = true }
run = '''
if [ -n "${CI:-}" ]; then
  echo "hooks:install: CI detected, skipping"
  exit 0
fi
pre-commit install --install-hooks
'''

[tasks.lock]
description = "Regenerate mise.lock for every supported platform"
run = "mise lock"

# --- Information ------------------------------------------------------------

[tasks.info]
description = "Show the Profile, Machine Roles and Toolchain versions"
run = "dotfiles-info"

# --- Checks (docs/adr/0001) --------------------------------------------------
# Each Check takes optional files; with none it checks the whole working tree.
# The commit hook (.pre-commit-config.yaml) and CI call these same tasks.

[tasks.check]
description = "Run every Check required before commit"
depends = [
  "check:syntax",
  "check:shellcheck",
  "check:shfmt",
  "check:zsh",
  "check:large-files",
  "check:secrets",
  "check:private-info",
]

[tasks."check:syntax"]
description = "Validate YAML, JSON, JSONC and TOML files"
usage = 'arg "[files]" var=#true help="Files to check (default: all)"'
run = 'eval "set -- ${usage_files:-}"; tools/checks/syntax.sh "$@"'

[tasks."check:shellcheck"]
description = "Lint shell scripts, rendering *.sh.tmpl first"
usage = 'arg "[files]" var=#true help="Files to check (default: all)"'
run = 'eval "set -- ${usage_files:-}"; tools/checks/shellcheck.sh "$@"'

[tasks."check:shfmt"]
description = "Verify shell formatting (no writes)"
usage = 'arg "[files]" var=#true help="Files to check (default: all)"'
run = 'eval "set -- ${usage_files:-}"; tools/checks/shfmt.sh "$@"'

[tasks."check:zsh"]
description = "Syntax-check zsh files (needs zsh)"
usage = 'arg "[files]" var=#true help="Files to check (default: all)"'
run = 'eval "set -- ${usage_files:-}"; tools/checks/zsh.sh "$@"'

[tasks."check:large-files"]
description = "Reject files over 1 MB"
usage = 'arg "[files]" var=#true help="Files to check (default: all)"'
run = 'eval "set -- ${usage_files:-}"; tools/checks/large-files.sh "$@"'

[tasks."check:secrets"]
description = "Scan staged changes (or a range) for secrets with gitleaks"
usage = '''
flag "--range <range>" help="Scan commits in A..B instead of staged changes"
flag "--all" help="Scan the whole history"
'''
run = '''
if [ "${usage_all:-false}" = true ]; then exec tools/checks/secrets.sh --all; fi
exec tools/checks/secrets.sh ${usage_range:+--range "$usage_range"}
'''

[tasks."check:private-info"]
description = "Scan staged changes (or a range) for private information"
usage = 'flag "--range <range>" help="Scan added lines in A..B instead of staged changes"'
run = 'exec tools/checks/private-info.sh ${usage_range:+--range "$usage_range"}'

[tasks.fmt]
description = "Format shell scripts in place"
usage = 'arg "[files]" var=#true help="Files to format (default: all)"'
run = 'eval "set -- ${usage_files:-}"; tools/checks/shfmt.sh --write "$@"'

# --- Tests ------------------------------------------------------------------

[tasks.test]
description = "Run the bats unit tests"
usage = 'arg "[file]" help="One test file, e.g. tests/templates.bats" default="tests"'
run = 'bats --timing --print-output-on-failure "${usage_file?}"'

[tasks."test:acceptance"]
description = "Run requirement acceptance tests (needs Docker)"
usage = 'arg "[file]" help="One acceptance test file, e.g. tests/acceptance/r02.bats" default="tests/acceptance"'
run = '''
if ! command -v docker >/dev/null 2>&1 || ! docker info >/dev/null 2>&1; then
  echo "test:acceptance: docker is required (install Docker and start the daemon)" >&2
  exit 1
fi
bats --timing --print-output-on-failure "${usage_file?}"
'''

# --- Housekeeping -----------------------------------------------------------

[tasks.clean]
description = "Remove build and test artifacts inside the repo"
run = "rm -rf .cache tests/.tmp && echo 'clean: removed .cache tests/.tmp'"
