# cocogitto configuration
# https://docs.cocogitto.io/
#
# cocogitto only validates commit messages here, through `check:commit-msg`
# (commit-msg hook) and `check:commits` (CI); tools/checks/commits.sh adds this
# repo's type list on top. It does not bump versions or write a changelog:
# Releases are date tags created by hand, and `mise run release:preview`
# prints their notes with git-cliff (cliff.toml). See GLOSSARY.md.

tag_prefix = "v"
ignore_merge_commits = true
disable_changelog = true
