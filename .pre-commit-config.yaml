# Git hooks for this public repo. Every check hook calls a `mise run check:*` task, so the
# commit hook, CI and `mise run check` run the same definitions (docs/adr/0001).
# Tool versions live in mise.toml, not here.
#
# Installed by `mise run hooks:install` (also run by tools/bootstrap.sh).
# Each hook id `<name>` runs task `check:<name>`; `check` depends on exactly these.
# The two hooks at the end are not checks: an execution-bit guard and the
# Conventional Commits message validator (commit-msg stage).
default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: syntax
        name: check:syntax
        entry: tools/hooks/mise-run check:syntax
        language: script
        types: [file]

      - id: shellcheck
        name: check:shellcheck
        entry: tools/hooks/mise-run check:shellcheck
        language: script
        types: [file]

      - id: shfmt
        name: check:shfmt
        entry: tools/hooks/mise-run check:shfmt
        language: script
        types: [file]

      - id: zsh
        name: check:zsh
        entry: tools/hooks/mise-run check:zsh
        language: script
        types: [file]

      - id: large-files
        name: check:large-files
        entry: tools/hooks/mise-run check:large-files
        language: script
        types: [file]

      - id: workflows
        name: check:workflows
        entry: tools/hooks/mise-run check:workflows
        language: script
        files: ^\.github/workflows/

      # Secrets and private information scan the staged diff at commit, and the
      # pushed range at push (so --no-verify commits and chezmoi autoCommits are caught).
      - id: secrets
        name: check:secrets
        entry: tools/hooks/mise-run check:secrets
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: private-info
        name: check:private-info
        entry: tools/hooks/mise-run check:private-info
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: file-set-execution-bit
        name: shell scripts are executable
        entry: ./home/dot_config/shell/functions/file-set-execution-bit.sh
        language: system
        files: '(\.sh$|^[^/]+\.bash$)'

      # Validate the commit message against Conventional Commits via cocogitto.
      # Mirrors the rule used by `cog bump`. pre-commit passes the path of the
      # commit message file as the filename argument.
      # See .github/skills/commit-and-release/SKILL.md.
      - id: cog-verify
        name: cog verify (conventional commits)
        entry: cog verify --file
        language: system
        stages: [commit-msg]
        always_run: true
