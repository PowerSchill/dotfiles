# Git hooks for this public repo. Every check hook calls a `mise run check:*` task, so the
# commit hook, CI and `mise run check` run the same definitions (docs/adr/0001).
# Tool versions live in mise.toml, not here.
#
# Installed by `mise run hooks:install` (also run by tools/bootstrap.sh).
# Each hook id `<name>` runs task `check:<name>`; `check` depends on exactly these.
# exec-bit fixes file modes rather than only reporting; commit-msg runs at the
# commit-msg stage, so `check` leaves it out (check:commits covers CI).
default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: syntax
        name: check:syntax
        entry: tools/hooks/mise-run check:syntax
        language: script
        types: [file]

      - id: shellcheck
        name: check:shellcheck
        entry: tools/hooks/mise-run check:shellcheck
        language: script
        types: [file]

      - id: shfmt
        name: check:shfmt
        entry: tools/hooks/mise-run check:shfmt
        language: script
        types: [file]

      - id: zsh
        name: check:zsh
        entry: tools/hooks/mise-run check:zsh
        language: script
        types: [file]

      - id: large-files
        name: check:large-files
        entry: tools/hooks/mise-run check:large-files
        language: script
        types: [file]

      - id: workflows
        name: check:workflows
        entry: tools/hooks/mise-run check:workflows
        language: script
        files: ^\.github/workflows/

      # Secrets and private information scan the staged diff at commit, and the
      # pushed range at push (so --no-verify commits and chezmoi autoCommits are caught).
      - id: secrets
        name: check:secrets
        entry: tools/hooks/mise-run check:secrets
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: private-info
        name: check:private-info
        entry: tools/hooks/mise-run check:private-info
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      # Not a pure check: makes staged shell scripts executable (and stages the mode).
      - id: exec-bit
        name: check:exec-bit
        entry: tools/hooks/mise-run check:exec-bit
        language: script
        files: '(\.sh$|^[^/]+\.bash$)'

      # Conventional Commits with this repo's type list, checked when the message
      # is written. pre-commit passes the path of the message file.
      - id: commit-msg
        name: check:commit-msg
        entry: tools/hooks/mise-run check:commit-msg
        language: script
        stages: [commit-msg]
